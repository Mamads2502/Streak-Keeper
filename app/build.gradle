plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.streakkeeper.app'
    compileSdk 35

    defaultConfig {
        // Keep the installed app identity so updates retain existing user data.
        applicationId 'fr.streakpresets.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
