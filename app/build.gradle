plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.streakpresets.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.streakpresets.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
